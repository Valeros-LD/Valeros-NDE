@if (nodeValues().length > 0) {
  <app-node-link-list
    [nodes]="nodeValues()"
    [showType]="false"
    [isExternal]="typedOptions().isExternal"
  />
}

@if (literalValues().length > 0) {
  <app-text-widget
    [node]="nodeWithLiteralValues()"
    property="literals"
    [options]="textOptions()"
  />
}
