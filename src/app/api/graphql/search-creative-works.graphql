query SearchCreativeWorks(
  $query: String
  $page: Int
  $perPage: Int
  $where: CreativeWorkWhere
) {
  creativeWorks(query: $query, page: $page, perPage: $perPage, where: $where) {
    items {
      ...CreativeWorkFields
    }
    pagination {
      total
      page
      perPage
    }
    facets {
      ...CreativeWorkFacetFields
    }
  }
}
