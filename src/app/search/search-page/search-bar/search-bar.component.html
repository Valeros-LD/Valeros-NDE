<div class="form-control">
  <div
    class="dropdown w-full"
    [class.dropdown-open]="autocomplete.showSuggestions()"
  >
    <label class="input input-bordered rounded-full flex items-center gap-2">
      <input
        type="text"
        [placeholder]="placeholder()"
        class="grow min-w-0"
        role="combobox"
        aria-autocomplete="list"
        aria-haspopup="listbox"
        [attr.aria-expanded]="autocomplete.showSuggestions()"
        [attr.aria-controls]="listboxId"
        [ngModel]="searchInputValue()"
        (ngModelChange)="onSearchTermChange($event)"
        (keydown)="onKeydown($event)"
        (focus)="onInputFocus()"
        (blur)="onInputBlur()"
      />
      <button
        class="btn btn-primary btn-sm rounded-full"
        (click)="onSearch()"
        [disabled]="store.loading()"
      >
        @if (store.loading()) {
          <app-loading-spinner size="md" [centered]="false" />
        } @else {
          <ng-icon name="featherSearch" size="16"></ng-icon> Zoek
        }
      </button>
    </label>

    @if (autocomplete.showSuggestions()) {
      <app-autocomplete-suggestions
        [id]="listboxId"
        [suggestions]="autocomplete.suggestions()"
        [loading]="autocomplete.loading()"
        [activeIndex]="autocomplete.activeIndex()"
        (selectSuggestion)="onSuggestionSelect($event)"
        (hoverIndex)="autocomplete.setActiveIndex($event)"
      />
    }
  </div>
</div>
